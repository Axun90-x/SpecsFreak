<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Specs Freak | Game Recommender</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <main class="container">
      <header class="hero">
        <p class="badge">NLP-Based Game Discovery</p>
        <h1>Specs Freak</h1>
        <p class="subtitle">
          Describe your ideal game in plain language and get intelligent recommendations
          beyond basic genre filtering.
        </p>
      </header>

      <section class="search-card">
        <form id="recommend-form">
          <label for="prompt">What game mood or experience do you want?</label>
          <div class="input-row">
            <input
              id="prompt"
              name="prompt"
              type="text"
              placeholder="e.g. dark story-rich RPG with open world exploration"
              required
            />
            <button id="submit-btn" type="submit">Find Games</button>
          </div>
        </form>
        <p id="status" class="status"></p>
      </section>

      <section>
        <div id="results" class="results"></div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
